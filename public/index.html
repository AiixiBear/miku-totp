<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aiixi Bear的TOTP</title>
<link rel="manifest" href="site.webmanifest" />
<link rel="preconnect" href="https://www.aiixi.cc" crossorigin="">
<link rel="icon" href="https://www.aiixi.cc/favicon.ico" type="image/ico">
<link rel="preconnect" href="https://challenges.cloudflare.com">

<style>
    @font-face {
        font-family: 'Huninn';
        src: url('https://www.aiixi.cc/fonts/Huninn-Regular.woff2') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }
    :root {
        --primary-color: #86CECB;
        --secondary-color: #86cecb;
        --glass-bg: rgba(255, 255, 255, 0.6);
        --text-color: #000000;
    }

    * { box-sizing: border-box; transition: all 0.3s ease; }

    body {
        font-family: 'Huninn', sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background-image: url('https://snowmiku.com/2026/images/index/mv_hero.webp');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed; 
        color: var(--text-color);
        padding: 20px;
        gap: 20px;
        flex-wrap: wrap;
    }

    .container {
        background: var(--glass-bg);
        padding: 2.5rem;
        border-radius: 24px;
        width: 100%;
        max-width: 480px;
        text-align: center;
        /*backdrop-filter: blur(5px);*/
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        align-self: flex-start;
        margin-top: 40px;
        /*-webkit-backdrop-filter: blur(5px);*/
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
        margin: 0 0 20px 0;
        font-size: 2rem;
        background: -webkit-linear-gradient(45deg, var(--primary-color), var(--secondary-color));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    input {
        width: 100%;
        padding: 12px 16px;
        margin: 8px 0;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        background: #f8fafc;
    }

    input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        font-family: 'Huninn';
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); }
    button:active { transform: translateY(0); }

    .cf-turnstile { margin-top: 15px; display: flex; justify-content: center; }

    #totp-codes { margin-top: 25px; display: grid; gap: 12px; }

    .code-card {
        background: rgba(255, 255, 255, 0.5);
        padding: 15px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-backdrop-filter: blur(5px); /* 確保 Safari 瀏覽器相容性 */
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .code-card:hover { transform: scale(1.02); border-color: var(--primary-color); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

    .app-name { font-size: 0.9rem; color: #64748b; font-weight: 500; }
    .app-code { font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; color: var(--text-color); font-family: 'Poppins', monospace; }

    .progress-container {
        width: 100%;
        height: 4px;
        background: #e2e8f0;
        border-radius: 2px;
        margin-top: 20px;
        overflow: hidden;
        display: none;
    }

    .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        width: 100%;
        transition: width 1s linear;
    }

    .timer-text { font-size: 0.8rem; color: var(--text-color); margin-top: 5px; display: block; }

    .copied-toast {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(134, 206, 203, 0.9);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        border-radius: 16px;
    }

    #logout-button {
        font-family: "Huninn";
        background: #fee2e2;
        color: #ef4444;
        box-shadow: none;
        margin-top: 20px;
    }
    #logout-button:hover { background: #fecaca; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }

    /* ===== Passkey ===== */
    #passkey-login-button {
        font-family: 'Huninn';
        background: #fff;
        color: var(--text-color);
        border: 2px solid var(--primary-color);
        box-shadow: none;
    }
    #passkey-login-button:hover { background: #f0fdfc; box-shadow: 0 4px 12px rgba(134, 206, 203, 0.3); }

    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0;
        color: #94a3b8;
        font-size: 0.8rem;
    }
    .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
    }

    #passkey-panel {
        margin-top: 25px;
        text-align: left;
    }
    #passkey-panel h3 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        color: #475569;
    }
    .passkey-item {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
    }
    .passkey-item .name { font-weight: 600; }
    .passkey-item .meta { color: #64748b; font-size: 0.75rem; }
    .passkey-delete-btn {
        width: auto;
        margin: 0;
        padding: 6px 12px;
        font-size: 0.75rem;
        background: #fee2e2;
        color: #ef4444;
        box-shadow: none;
    }
    .passkey-delete-btn:hover { background: #fecaca; }
    #add-passkey-button {
        font-family: 'Huninn', sans-serif;
        background: #f1f5f9;
        color: #475569;
        box-shadow: none;
        font-size: 0.9rem;
    }
    #add-passkey-button:hover { background: #e2e8f0; }
    #passkey-empty { color: #94a3b8; font-size: 0.85rem; padding: 8px 0; }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #status { display: block; margin-top: 10px; font-size: 0.9rem; min-height: 20px; }

    /* ===== 日誌面板 ===== */
    #log-panel {
        display: none;
        background: var(--glass-bg);
        padding: 2rem;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 560px;
        align-self: flex-start;
        margin-top: 40px;
        animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #log-panel h2 {
        margin: 0 0 16px 0;
        font-size: 1.2rem;
        color: #475569;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #log-panel h2 .dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--primary-color);
        display: inline-block;
        box-shadow: 0 0 8px var(--primary-color);
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
    }

    #log-list {
        max-height: 520px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scrollbar-width: thin;
        scrollbar-color: #e2e8f0 transparent;
    }

    .log-entry {
        background: #f8fafc;
        border-radius: 12px;
        padding: 10px 14px;
        border-left: 4px solid #e2e8f0;
        font-size: 0.82rem;
        line-height: 1.5;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .log-entry.info  { border-left-color: #86CECB; }
    .log-entry.warn  { border-left-color: #f59e0b; background: #fffbeb; }
    .log-entry.error { border-left-color: #ef4444; background: #fff5f5; }

    .log-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
    }

    .log-badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .log-badge.info  { background: #d1fae5; color: #065f46; }
    .log-badge.warn  { background: #fef3c7; color: #92400e; }
    .log-badge.error { background: #fee2e2; color: #991b1b; }

    .log-time { color: #94a3b8; font-size: 0.75rem; font-family: monospace; }

    .log-event { color: #334155; font-weight: 600; margin-bottom: 2px; }

    .log-detail { color: #64748b; font-size: 0.78rem; word-break: break-all; }

    #log-refresh-btn {
        margin-top: 14px;
        background: #f1f5f9;
        color: #475569;
        box-shadow: none;
        font-size: 0.85rem;
        padding: 9px;
        border-radius: 10px;
    }
    #log-refresh-btn:hover { background: #e2e8f0; transform: none; box-shadow: none; }

    .log-empty { text-align: center; color: #94a3b8; padding: 30px 0; font-size: 0.9rem; }

    /* ===== 設定區塊 ===== */
    #settings-panel {
        margin-top: 20px;
        text-align: left;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.4);
    }
    #settings-panel h3 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        color: #475569;
    }
    .toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        cursor: pointer;
        user-select: none;
    }
    .toggle-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin: 0;
        accent-color: var(--primary-color);
        cursor: pointer;
    }
    .toggle-row input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.5; }
    .settings-hint {
        display: none;
        margin-top: 8px;
        font-size: 0.78rem;
        color: #94a3b8;
    }

    /* ===== 鎖定畫面 ===== */
    #lock-screen {
        display: none;
        text-align: center;
        font-family: 'Huninn';
    }
    #lock-icon { font-size: 2.5rem; margin-bottom: 10px; }
    #lock-status { display: block; margin-top: 10px; font-size: 0.9rem; color: #ff0000; min-height: 20px; }
    #unlock-logout-button {
        background: #f1f5f9;
        color: #475569;
        box-shadow: none;
        margin-top: 10px;
        font-family: 'Huninn';
    }
    #unlock-logout-button:hover { background: #e2e8f0; }
</style>
</head>
<body>

<div class="container">
    <h1>Aiixi Miku TOTP</h1>
    <div style="margin-bottom: 15px; font-size: 0.85rem; color: var(--text-color);">
        裝置時間：<span id="now-datetime">Loading...</span><br />
        伺服器時間：<span id="server-datetime">Loading...</span>
    </div>

    <div id="login-form">
        <input type="text" id="username" placeholder="帳號" />
        <input type="password" id="password" placeholder="密碼" />
        <div class="cf-turnstile" data-sitekey="0x4AAAAAACMc7m5CnLl1fmZs"></div>
        <button onclick="login()" >大便登入</button>
        <div class="divider">或</div>
        <button id="passkey-login-button" onclick="loginWithPasskey()">🔑 使用 Passkey 登入</button>
    </div>

    <div id="lock-screen">
        <div id="lock-icon">🔒</div>
        <p>已啟用開啟即驗證，請使用 Passkey 解鎖</p>
        <button onclick="unlockWithPasskey()" id="passkey-login-button" >🔑 使用 Passkey 解鎖</button>
        <button id="unlock-logout-button" onclick="logout()">改用帳密登入</button>
        <span id="lock-status"></span>
    </div>

    <span id="status" style="color:#ff0000;"></span>

    <div id="main-content" style="display:none;">
        <div id="countdown-wrapper">
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span class="timer-text">下次更新：<span id="time-left">-</span> 秒</span>
        </div>
        <div id="totp-codes"></div>

        <div id="passkey-panel">
            <h3>🔑 Passkey 裝置管理</h3>
            <div id="passkey-list"><div id="passkey-empty">載入中…</div></div>
            <button id="add-passkey-button" onclick="registerPasskey()">＋ 新增這台裝置的 Passkey</button>
        </div>

        <div id="settings-panel">
            <h3>⚙️ 安全設定</h3>
            <label class="toggle-row">
                <input type="checkbox" id="require-passkey-toggle" onchange="toggleRequirePasskey(this.checked)" />
                <span>每次開啟都要用 Passkey 驗證</span>
            </label>
            <div id="settings-hint" class="settings-hint"></div>
        </div>

        <button id="logout-button" onclick="logout()">大便登出</button>
    </div>
</div>

<!-- 日誌面板 -->
<div id="log-panel">
    <h2><span class="dot"></span> 大便日誌</h2>
    <div id="log-list"><div class="log-empty">載入中…</div></div>
    <button id="log-refresh-btn" onclick="fetchLogs()">重新整理</button>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://unpkg.com/@simplewebauthn/browser@13/dist/bundle/index.umd.min.js"></script>
<script>
let JWT_TOKEN = null;
let fetchInterval = null;
let countdownInterval = null;
let logInterval = null;
let serverTimeOffset = 0;

// ===== 時間工具 =====
function formatDateTime(date) {
    const pad = n => n.toString().padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} `
         + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
}

function updateCurrentDateTime() {
    const now = new Date();
    document.getElementById('now-datetime').textContent = formatDateTime(now);
    document.getElementById('server-datetime').textContent = formatDateTime(new Date(Date.now() + serverTimeOffset));
}
updateCurrentDateTime();
setInterval(updateCurrentDateTime, 1000);

// ===== 顯示控制 =====
function showMainContent(show) {
    document.getElementById('login-form').style.display = show ? 'none' : 'block';
    document.getElementById('main-content').style.display = show ? 'block' : 'none';
    document.getElementById('log-panel').style.display = show ? 'block' : 'none';
    document.getElementById('lock-screen').style.display = 'none';
    const pc = document.getElementById('progress-container');
    if (pc) pc.style.display = show ? 'block' : 'none';
    if (!show) document.getElementById('status').textContent = '';
}

function showLockScreen() {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('main-content').style.display = 'none';
    document.getElementById('log-panel').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'block';
}

// ===== 開啟即驗證 Passkey 設定（存於本機瀏覽器）=====
const REQUIRE_PASSKEY_KEY = 'require_passkey_unlock';

function getRequirePasskeyUnlock() {
    const v = localStorage.getItem(REQUIRE_PASSKEY_KEY);
    return v === null ? true : v === 'true';
}

function setRequirePasskeyUnlock(value) {
    localStorage.setItem(REQUIRE_PASSKEY_KEY, value ? 'true' : 'false');
}

function toggleRequirePasskey(checked) {
    setRequirePasskeyUnlock(checked);
}

// 依目前已註冊的 Passkey 數量，同步設定區塊的勾選狀態
function updateSettingsPasskeyState(count) {
    const toggle = document.getElementById('require-passkey-toggle');
    const hint = document.getElementById('settings-hint');
    if (!toggle || !hint) return;
    if (count === 0) {
        toggle.checked = false;
        toggle.disabled = true;
        setRequirePasskeyUnlock(false);
        hint.textContent = '請先新增至少一組 Passkey，才能開啟這個功能';
        hint.style.display = 'block';
    } else {
        toggle.disabled = false;
        toggle.checked = getRequirePasskeyUnlock();
        hint.style.display = 'none';
    }
}

// ===== 登入 =====
async function login() {
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const token = turnstile.getResponse();

    if (!usernameEl.value || !passwordEl.value) {
        alert("嗚哇！帳號密碼是空的，我會看不見妳啦！ >_<");
        return;
    }
    if (!token) {
        alert("哼哼！請先完成我不是機器人驗證(⁠｡⁠・⁠/⁠/⁠/⁠・⁠｡⁠)");
        return;
    }

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: usernameEl.value, password: passwordEl.value, cf_turnstile_token: token })
        });
        const data = await res.json();
        if (!res.ok) {
            document.getElementById('status').textContent = '登入失敗：' + (data.error || '未知錯誤');
            turnstile.reset();
            return;
        }
        JWT_TOKEN = data.token;
        localStorage.setItem('jwt_token', data.token);
        startSession();
    } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = '連線出錯了，心碎了啦 QQ';
        turnstile.reset();
    }
}

// ===== Session 啟動 =====
async function startSession() {
    try {
        const res = await fetch('/api/validate', { headers: { 'Authorization': 'Bearer ' + JWT_TOKEN } });
        const data = await res.json();
        if (res.ok && data.serverTime) {
            serverTimeOffset = data.serverTime - Date.now();
        }
        showMainContent(true);
        fetchCodes();
        fetchLogs();
        fetchPasskeys();
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(updateCountdown, 1000);
        // 每 30 秒自動刷新日誌
        if (logInterval) clearInterval(logInterval);
        logInterval = setInterval(fetchLogs, 30000);
    } catch (e) {
        logout();
    }
}

// ===== Passkey 登入 =====
async function loginWithPasskey() {
    const statusEl = document.getElementById('status');
    if (!window.SimpleWebAuthnBrowser || !window.SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
        statusEl.textContent = '這個瀏覽器不支援 Passkey QQ';
        return;
    }
    try {
        const optionsRes = await fetch('/api/passkey/login-options');
        const options = await optionsRes.json();
        if (!optionsRes.ok) {
            statusEl.textContent = options.error === 'no passkeys registered'
                ? '目前還沒有註冊任何 Passkey，請先用帳密登入後新增'
                : '無法取得 Passkey 登入資訊';
            return;
        }

        const authResponse = await window.SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: options });

        const verifyRes = await fetch('/api/passkey/login-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(authResponse)
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) {
            statusEl.textContent = 'Passkey 登入失敗：' + (verifyData.error || '未知錯誤');
            return;
        }

        JWT_TOKEN = verifyData.token;
        localStorage.setItem('jwt_token', verifyData.token);
        startSession();
    } catch (err) {
        console.error(err);
        if (err.name !== 'NotAllowedError') {
            statusEl.textContent = 'Passkey 登入發生錯誤：' + err.message;
        }
    }
}

// ===== Passkey 新增 =====
async function registerPasskey() {
    if (!JWT_TOKEN) return;
    if (!window.SimpleWebAuthnBrowser || !window.SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
        alert('這個瀏覽器不支援 Passkey QQ');
        return;
    }
    try {
        const optionsRes = await fetch('/api/passkey/register-options', {
            headers: { 'Authorization': 'Bearer ' + JWT_TOKEN }
        });
        const options = await optionsRes.json();
        if (!optionsRes.ok) {
            alert('無法取得註冊資訊：' + (options.error || '未知錯誤'));
            return;
        }

        const regResponse = await window.SimpleWebAuthnBrowser.startRegistration({ optionsJSON: options });

        const deviceName = prompt('幫這把 Passkey 取個名字吧（例如「我的 iPhone」）：', '') || '未命名裝置';

        const verifyRes = await fetch('/api/passkey/register-verify', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + JWT_TOKEN
            },
            body: JSON.stringify({ ...regResponse, deviceName })
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) {
            alert('Passkey 註冊失敗：' + (verifyData.error || '未知錯誤'));
            return;
        }

        fetchPasskeys();
    } catch (err) {
        console.error(err);
        if (err.name !== 'NotAllowedError') {
            alert('Passkey 註冊發生錯誤：' + err.message);
        }
    }
}

// ===== Passkey 列表 =====
async function fetchPasskeys() {
    if (!JWT_TOKEN) return;
    try {
        const res = await fetch('/api/passkey/list', { headers: { 'Authorization': 'Bearer ' + JWT_TOKEN } });
        if (!res.ok) return;
        const data = await res.json();
        renderPasskeys(data.passkeys || []);
    } catch (err) { console.error('Passkey 列表讀取失敗：', err); }
}

function renderPasskeys(passkeys) {
    const list = document.getElementById('passkey-list');
    if (!passkeys.length) {
        list.innerHTML = '<div id="passkey-empty">目前沒有註冊任何 Passkey</div>';
    } else {
        list.innerHTML = '';
        passkeys.forEach(pk => {
            const item = document.createElement('div');
            item.className = 'passkey-item';
            item.innerHTML = `
                <div>
                    <div class="name"></div>
                    <div class="meta"></div>
                </div>
                <button class="passkey-delete-btn">刪除</button>
            `;
            item.querySelector('.name').textContent = pk.name;
            item.querySelector('.meta').textContent = new Date(pk.createdAt).toLocaleString('zh-TW', { hour12: false });
            item.querySelector('.passkey-delete-btn').onclick = () => deletePasskey(pk.id);
            list.appendChild(item);
        });
    }
    updateSettingsPasskeyState(passkeys.length);
}

async function deletePasskey(id) {
    if (!JWT_TOKEN) return;
    if (!confirm('確定要刪除這把 Passkey 嗎？')) return;
    try {
        const res = await fetch('/api/passkey/' + encodeURIComponent(id), {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + JWT_TOKEN }
        });
        if (!res.ok) {
            alert('刪除失敗');
            return;
        }
        fetchPasskeys();
    } catch (err) { console.error('刪除 Passkey 失敗：', err); }
}

// ===== 開啟即驗證：用 Passkey 解鎖現有 session =====
async function unlockWithPasskey() {
    const statusEl = document.getElementById('lock-status');
    statusEl.textContent = '';
    if (!window.SimpleWebAuthnBrowser || !window.SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
        statusEl.textContent = '這個瀏覽器不支援 Passkey，請改用帳密登入';
        return;
    }
    try {
        const optionsRes = await fetch('/api/passkey/login-options');
        const options = await optionsRes.json();
        if (!optionsRes.ok) {
            statusEl.textContent = '無法取得 Passkey 驗證資訊';
            return;
        }

        const authResponse = await window.SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: options });

        const verifyRes = await fetch('/api/passkey/login-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(authResponse)
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) {
            statusEl.textContent = '解鎖失敗：' + (verifyData.error || '未知錯誤');
            return;
        }

        JWT_TOKEN = verifyData.token;
        localStorage.setItem('jwt_token', verifyData.token);
        startSession();
    } catch (err) {
        console.error(err);
        if (err.name !== 'NotAllowedError') {
            statusEl.textContent = '發生錯誤：' + err.message;
        }
    }
}

// ===== 倒數計時 =====
function updateCountdown() {
    const el = document.getElementById('time-left');
    const bar = document.getElementById('progress-bar');
    if (!JWT_TOKEN) return;

    const correctedNow = Math.floor((Date.now() + serverTimeOffset) / 1000);
    const secs = 30 - (correctedNow % 30);

    if (el) el.textContent = secs;
    if (bar) {
        bar.style.width = (secs / 30 * 100) + '%';
        bar.style.background = secs < 5 ? '#ef4444' : 'linear-gradient(90deg, var(--primary-color), var(--secondary-color))';
    }
    if (secs === 30) fetchCodes();
}

// ===== 抓 TOTP =====
async function fetchCodes() {
    if (!JWT_TOKEN) return;
    try {
        const res = await fetch('/api/totp', { headers: { 'Authorization': 'Bearer ' + JWT_TOKEN } });
        const data = await res.json();
        if (!res.ok) { logout(); return; }

        const container = document.getElementById('totp-codes');
        container.innerHTML = '';
        data.result.forEach(app => {
            const div = document.createElement('div');
            div.className = 'code-card';
            div.innerHTML = `
                <div style="text-align:left">
                    <div class="app-name">${app.name}</div>
                    <div class="app-code">${formatCode(app.code)}</div>
                </div>
                <div style="font-size:1.2rem; color:#cbd5e1;">複製</div>
                <div class="copied-toast">已複製</div>
            `;
            div.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(app.code);
                    const toast = div.querySelector('.copied-toast');
                    toast.style.opacity = '1';
                    setTimeout(() => toast.style.opacity = '0', 1000);
                } catch (err) { console.error('Copy failed', err); }
            };
            container.appendChild(div);
        });
    } catch (err) { console.error('抓碼失敗：', err); }
}

function formatCode(code) {
    return code.length === 6 ? code.slice(0,3) + ' ' + code.slice(3) : code;
}

// ===== 抓日誌 =====
async function fetchLogs() {
    if (!JWT_TOKEN) return;
    try {
        const res = await fetch('/api/logs', { headers: { 'Authorization': 'Bearer ' + JWT_TOKEN } });
        if (!res.ok) return;
        const data = await res.json();
        renderLogs(data.logs || []);
    } catch (err) { console.error('日誌讀取失敗：', err); }
}

function renderLogs(logs) {
    const list = document.getElementById('log-list');
    if (!logs.length) {
        list.innerHTML = '<div class="log-empty">目前沒有日誌紀錄</div>';
        return;
    }

    list.innerHTML = ''; // 清空

    logs.forEach(log => {
        const level = log.level || 'info';
        const time = new Date(log.time).toLocaleString('zh-TW', { hour12: false });
        const { time: _t, level: _l, event: _e, port: _p, ...rest } = log;

        // 外層卡片用 innerHTML 寫靜態結構（無動態內容）
        const entry = document.createElement('div');
        entry.className = `log-entry ${level}`;
        entry.innerHTML = `
            <div class="log-meta">
                <span class="log-badge ${level}">${level}</span>
                <span class="log-time"></span>
            </div>
            <div class="log-event"></div>
            <div class="log-detail"></div>
        `;

        // 動態資料一律用 textContent，完全不經過 HTML 解析
        entry.querySelector('.log-time').textContent = time;
        entry.querySelector('.log-event').textContent = log.event;

        const detailEl = entry.querySelector('.log-detail');
        const detailParts = Object.entries(rest)
            .map(([k, v]) => `${k}: ${v}`)
            .join('  ·  ');
        detailEl.textContent = detailParts;

        list.appendChild(entry);
    });
}
// ===== 登出 =====
function logout() {
    JWT_TOKEN = null;
    localStorage.removeItem('jwt_token');
    if (countdownInterval) clearInterval(countdownInterval);
    if (logInterval) clearInterval(logInterval);
    try { turnstile.reset(); } catch(e) {}
    showMainContent(false);
}

// ===== 自動登入 =====
(function initAuth() {
    const token = localStorage.getItem('jwt_token');
    if (!token) return;
    JWT_TOKEN = token;
    if (getRequirePasskeyUnlock()) {
        showLockScreen();
    } else {
        startSession();
    }
})();

// ===== 若瀏覽器不支援 Passkey，隱藏相關按鈕 =====
window.addEventListener('DOMContentLoaded', () => {
    if (!window.SimpleWebAuthnBrowser || !window.SimpleWebAuthnBrowser.browserSupportsWebAuthn()) {
        const btn = document.getElementById('passkey-login-button');
        const divider = document.querySelector('.divider');
        if (btn) btn.style.display = 'none';
        if (divider) divider.style.display = 'none';
    }
});
</script>
